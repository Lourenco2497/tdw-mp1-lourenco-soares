version: 2.1

jobs:
  install:
    docker:
      - image: node:24-bookworm
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-node24-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-node24-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

  quality:
    docker:
      - image: node:24-bookworm
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-node24-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Format check
          command: npm run format:check
      - run:
          name: Tests
          command: npm test
      - run:
          name: Type check
          command: npm run typecheck

  build:
    docker:
      - image: node:24-bookworm
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-node24-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build static site
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - out

  deploy:
    docker:
      - image: node:24-bookworm
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Deploy static site to Cloudflare Pages
          command: |
            test -f out/index.html
            npx --yes wrangler@4 pages deploy out --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=main

workflows:
  pipeline:
    jobs:
      - install
      - quality:
          requires:
            - install
      - build:
          requires:
            - quality
      - deploy:
          requires:
            - build
          filters: pipeline.git.branch == "main"
