name: Copilot connection check

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Explain example failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "Sem usar ferramentas, explica em português a causa provável deste erro de build e sugere duas verificações: Contentful configuration is missing a space ID or access token." \
            -s --no-ask-user >> "$GITHUB_STEP_SUMMARY"
