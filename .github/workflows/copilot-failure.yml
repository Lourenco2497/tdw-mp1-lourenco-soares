name: Copilot failure diagnosis

on:
  workflow_run:
    workflows: [PipeLine]
    types: [completed]

permissions:
  contents: read
  actions: read
  copilot-requests: write

jobs:
  diagnose:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login == github.repository_owner &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push", "repository_dispatch", "schedule"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted diagnosis code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Diagnose failed pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/copilot-diagnosis.mjs
